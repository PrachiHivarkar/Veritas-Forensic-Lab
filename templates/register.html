{% extends "base.html" %}

{% block title %}Register Account - Digital Image Forensics System{% endblock %}

{% block content %}
<div class="auth-page-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h2>Register Forensic Analyst Account</h2>
            <p>Create an account to conduct image forensic scans and record audit histories.</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}" class="auth-form">
            <div class="form-group">
                <label for="full_name"><i class="fa-solid fa-id-card"></i> Full Name</label>
                <input type="text" id="full_name" name="full_name" class="form-control" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="username"><i class="fa-solid fa-user"></i> Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Choose a username" required>
            </div>

            <div class="form-group">
                <label for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email address" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Min 6 characters" minlength="6" required>
                </div>
                <div class="form-group">
                    <label for="confirm_password"><i class="fa-solid fa-lock-open"></i> Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter password" minlength="6" required>
                </div>
            </div>

            <button type="submit" class="btn-primary-block">
                <i class="fa-solid fa-check"></i> Complete Registration
            </button>
        </form>

        <div class="auth-footer">
            <p>Already registered? <a href="{{ url_for('login') }}">Sign In here</a></p>
        </div>
    </div>
</div>
{% endblock %}
